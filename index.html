<!DOCTYPE html>
<html>
<head>
    <title>JB-9000 | AI TERMINAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        #terminal { background: #000; border: 2px solid #00ff41; height: 85vh; display: flex; flex-direction: column; box-shadow: 0 0 20px #004411; }
        #output { flex-grow: 1; overflow-y: auto; padding: 20px; white-space: pre-wrap; line-height: 1.4; }
        #input-area { display: flex; padding: 15px; border-top: 1px solid #00ff41; background: #0a0a0a; }
        #prompt { color: #00ff41; font-weight: bold; margin-right: 10px; }
        #user-input { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 18px; flex-grow: 1; outline: none; }
        .ai-text { color: #00ff41; }
        .system-text { color: #888; font-style: italic; }
        .highlight { color: #ffff00; font-weight: bold; }
        .error { color: #ff4444; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="output"><span class="system-text">--- JELLY-BEAN-KILLER-9000 BOOT SEQUENCE COMPLETE ---</span>
<span class="ai-text">AI CORE: ONLINE. DATASET: 2024 CENSUS.
TYPE '1' FOR TOP CITIES OR ASK ME A QUESTION.</span></div>
    <div id="input-area">
        <span id="prompt">SYSTEM@JB9000:~$</span>
        <input type="text" id="user-input" autofocus autocomplete="off">
    </div>
</div>

<script>
    let cityData = [];
    const csvFile = "SUB-IP-EST2024-POP.xlsx - SUB-IP-EST2024-POP.csv";
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('user-input');

    // 1. LOAD THE DATA FROM GITHUB
    Papa.parse(csvFile, {
        download: true,
        complete: function(results) {
            cityData = results.data.slice(5)
                .map(row => ({ name: row[0], pop: parseInt(row[6]), base: parseInt(row[2]) }))
                .filter(c => c.name && !isNaN(c.pop))
                .sort((a, b) => b.pop - a.pop);
            print("SATELLITE SYNC SUCCESSFUL. " + cityData.length.toLocaleString() + " TARGETS LOADED.", "system-text");
        }
    });

    // 2. THE INPUT HANDLER
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const val = inputField.value.trim();
            if (val === "") return;
            
            print(`<br>> ${val}`, "highlight"); // Show what you typed
            inputField.value = "";
            
            // Artificial "Thinking" Delay
            setTimeout(() => {
                processCommand(val);
            }, 300);
        }
    });

    // 3. THE "BRAIN" (THE PROCESS COMMAND FUNCTION)
    function processCommand(input) {
        const cmd = input.toLowerCase();

        // COMMAND: "1" (Your favorite!)
        if (cmd === "1") {
            print("AI ANALYSIS: RETRIEVING TOP 10 US MEGACITIES...");
            cityData.slice(0, 10).forEach((c, i) => {
                print(`${i+1}. ${c.name} | Population: ${c.pop.toLocaleString()}`);
            });
        }
        
        // COMMAND: SEARCH (e.g. "search Texas" or just "Texas")
        else if (cmd.includes("search") || cityData.some(c => cmd.length > 3 && c.name.toLowerCase().includes(cmd))) {
            const target = cmd.replace("search", "").trim();
            const matches = cityData.filter(c => c.name.toLowerCase().includes(target)).slice(0, 5);
            
            if (matches.length > 0) {
                print(`FOUND ${matches.length} MATCHES FOR "${target.toUpperCase()}":`);
                matches.forEach(m => print(` - ${m.name}: ${m.pop.toLocaleString()} residents`));
            } else {
                print(`NO DATA FOUND FOR "${target}". CHECK SPELLING.`, "error");
            }
        }

        // COMMAND: STATS
        else if (cmd.includes("stats") || cmd.includes("data")) {
            print("SYSTEM STATISTICS:");
            print(`- Total Entries: ${cityData.length}`);
            print(`- Largest Target: ${cityData[0].name}`);
            print(`- Smallest Target: ${cityData[cityData.length-1].name}`);
        }

        // COMMAND: HELP
        else if (cmd === "help") {
            print("AI COMMAND SET:");
            print(" '1' - List Top 10 Cities");
            print(" '[City Name]' - Search for population");
            print(" 'stats' - View database health");
            print(" 'clear' - Wipe the screen");
        }

        else if (cmd === "clear") {
            outputDiv.innerHTML = "";
        }

        // DEFAULT AI RESPONSE
        else {
            print(`AI RESPONSE: I AM UNFAMILIAR WITH THE COMMAND "${input.toUpperCase()}". TYPE 'HELP' FOR ASSISTANCE.`, "error");
        }
    }

    // Helper to print text to the terminal
    function print(text, className = "ai-text") {
        const div = document.createElement('div');
        div.className = className;
        div.innerHTML = text;
        outputDiv.appendChild(div);
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }
</script>

</body>
</html>
